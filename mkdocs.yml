site_name: Economic Evidence Graph
site_description: A versioned, auditable evidence layer for economic research and policy synthesis
site_author: Ryan Wallace
site_url: https://ryancswallace.github.io/economic-evidence-graph/
repo_name: ryancswallace/economic-evidence-graph
repo_url: https://github.com/ryancswallace/economic-evidence-graph
edit_uri: blob/main/docs/

docs_dir: docs
site_dir: site
strict: true

watch:
  - src/economic_evidence_graph

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

extra_css:
  - stylesheets/navigation.css

theme:
  name: material
  locale: en
  font: false
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

exclude_docs: |
  _scripts/

plugins:
  - search
  - gen-files:
      scripts:
        - docs/_scripts/gen_api_reference.py
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - How-to guides:
      - How-to guides overview: how-to/index.md
      - Run locally: how-to/local-development.md
      - Clients and agent tools: how-to/clients-and-agent-tools.md
  - Reference:
      - Reference overview: reference/index.md
      - Configuration: reference/configuration.md
      - Client and agent-tool contracts: reference/clients-and-agent-tools.md
      - API:
          - Package: reference/api/index.md
          - Bootstrap: reference/api/bootstrap.md
          - CLI: reference/api/cli.md
          - Client: reference/api/client.md
          - Configuration module: reference/api/config.md
          - Exceptions: reference/api/exceptions.md
          - Parsers: reference/api/parsers.md
          - Policy: reference/api/policy.md
          - Serialization: reference/api/serialization.md
  - Explanation:
      - Explanation overview: explanation/index.md
      - Technical design: explanation/technical-design.md
      - Step 1 foundation: explanation/step-1-foundation.md
      - Step 2 corpus foundation: explanation/step-2-corpus-foundation.md
      - Step 3 search and historical pilot: explanation/step-3-search-foundation.md
      - Step 4 projects and evidence: explanation/step-4-projects-and-evidence.md
      - Step 5 clients and readiness: explanation/step-5-clients-and-readiness.md
      - Tooling: explanation/tooling.md
  - Maintainer runbooks:
      - Maintainer runbooks overview: runbooks/index.md
      - Database migrations: runbooks/database-migrations.md
      - Local operations and pilot acceptance: runbooks/local-operations.md
      - Release: runbooks/release.md
  - Project:
      - Development: project/development.md
      - Contributing: project/contributing.md
      - Changelog: project/changelog.md
