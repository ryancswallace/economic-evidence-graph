# cspell:words ReDIF FOMC fomccalendars
schema_version = "eeg.source-registry.v2"
default_action = "deny"

# This registry approves a bounded internal research pilot. Unknown rights do not
# block internal retrieval, storage, extraction, or embedding. They always block
# full-text display, export, and redistribution.

[[sources]]
code = "repec"
display_name = "Research Papers in Economics"
connector = "repec_metadata"
policy_version = 1
enabled = true
review_status = "approved_internal_pilot"
hosts = ["ideas.repec.org", "repec.org", "www.repec.org", "rsync.repec.org"]
path_prefixes = ["/"]
allow_external_content_hosts = true
requests_per_minute = 30
concurrency = 1
maximum_response_bytes = 52428800
scope = "Metadata augmentation for macroeconomics, monetary policy, and FRS seed records"
discovery_method = "Official RePEc-ReDIF rsync archive; linked content is separately evaluated"

[sources.actions]
discover_metadata = "allow_internal"
store_metadata = "allow_internal"
fetch_content = "allow_internal"
store_raw = "allow_internal"
extract_text = "allow_internal"
embed_content = "allow_internal"
display_snippet = "allow_if_attributed"
display_full_text = "deny"
export_metadata = "allow"
export_excerpt = "allow_if_attributed"
export_full_text = "deny"
redistribute = "deny"

